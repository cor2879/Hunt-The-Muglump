name: Deploy Hunt the Muglump WebGL

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WebGL wrapper
        uses: actions/checkout@v4

      - name: Download WebGL release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release site
          gh release download webgl-7.1.13 \
            --pattern 'HuntTheMuglump.7.1.13-WebGL-ready.zip' \
            --dir release
          unzip -q release/HuntTheMuglump.7.1.13-WebGL-ready.zip -d site
          cp .github/webgl-template/index.html site/index.html
          cp .github/webgl-template/style.css site/TemplateData/style.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
